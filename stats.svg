<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
<title id="title">Local animated GitHub profile stats</title><desc id="desc">A decorative rank ring with local snapshot rows for repositories, followers, following, and achievements.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0714"/><stop offset="1" stop-color="#2d0e40"/></linearGradient><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff72c8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="2" y="2" width="756" height="316" rx="25" fill="url(#bg)" stroke="#d946ef" stroke-opacity=".55" stroke-width="2"/>
<text x="28" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="900" letter-spacing="2" fill="#f5d0fe">PROFILE SNAPSHOT</text><text x="730" y="38" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#9f86af">29 JUL 2026</text>
<g transform="translate(146 171)">
  <circle r="92" fill="#160b22" stroke="#321542" stroke-width="14"/>
  <circle r="92" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="578" transform="rotate(-90)" filter="url(#g)"><animate attributeName="stroke-dashoffset" from="578" to="104" dur="1.3s" begin=".3s" fill="freeze"/></circle>
  <text y="10" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="950" fill="#fff2ff" opacity="0">A<animate attributeName="opacity" from="0" to="1" dur=".5s" begin="1s" fill="freeze"/></text>
  <text y="39" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2" fill="#d8b4fe">BUILDER RANK</text>
</g>
<g opacity="0" transform="translate(24 0)">
  <animate attributeName="opacity" from="0" to="1" dur=".45s" begin="0.55s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur=".45s" begin="0.55s" fill="freeze"/>
  <text x="300" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#dac5e7" letter-spacing="1">PUBLIC REPOSITORIES</text>
  <text x="690" y="82" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="900" fill="#ff72c8">26</text>
  <rect x="300" y="94" width="390" height="7" rx="3.5" fill="#2b173c"/>
  <rect x="300" y="94" width="0" height="7" rx="3.5" fill="#ff72c8"><animate attributeName="width" from="0" to="292" dur=".75s" begin="0.71s" fill="freeze"/></rect>
</g><g opacity="0" transform="translate(24 0)">
  <animate attributeName="opacity" from="0" to="1" dur=".45s" begin="0.73s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur=".45s" begin="0.73s" fill="freeze"/>
  <text x="300" y="130" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#dac5e7" letter-spacing="1">FOLLOWERS</text>
  <text x="690" y="130" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="900" fill="#c06cff">3</text>
  <rect x="300" y="142" width="390" height="7" rx="3.5" fill="#2b173c"/>
  <rect x="300" y="142" width="0" height="7" rx="3.5" fill="#c06cff"><animate attributeName="width" from="0" to="203" dur=".75s" begin="0.89s" fill="freeze"/></rect>
</g><g opacity="0" transform="translate(24 0)">
  <animate attributeName="opacity" from="0" to="1" dur=".45s" begin="0.91s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur=".45s" begin="0.91s" fill="freeze"/>
  <text x="300" y="178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#dac5e7" letter-spacing="1">FOLLOWING</text>
  <text x="690" y="178" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="900" fill="#a78bfa">2</text>
  <rect x="300" y="190" width="390" height="7" rx="3.5" fill="#2b173c"/>
  <rect x="300" y="190" width="0" height="7" rx="3.5" fill="#a78bfa"><animate attributeName="width" from="0" to="164" dur=".75s" begin="1.07s" fill="freeze"/></rect>
</g><g opacity="0" transform="translate(24 0)">
  <animate attributeName="opacity" from="0" to="1" dur=".45s" begin="1.09s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur=".45s" begin="1.09s" fill="freeze"/>
  <text x="300" y="226" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#dac5e7" letter-spacing="1">GITHUB ACHIEVEMENTS</text>
  <text x="690" y="226" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="900" fill="#ff9dcf">2</text>
  <rect x="300" y="238" width="390" height="7" rx="3.5" fill="#2b173c"/>
  <rect x="300" y="238" width="0" height="7" rx="3.5" fill="#ff9dcf"><animate attributeName="width" from="0" to="226" dur=".75s" begin="1.25s" fill="freeze"/></rect>
</g>
<text x="28" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#9f86af">Static local card • public-profile values can change after this snapshot</text>
</svg>