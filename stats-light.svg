<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
<title id="title">Local animated GitHub profile stats</title><desc id="desc">A decorative rank ring with local snapshot rows for repositories, followers, following, and achievements.</desc>
<defs>
  <linearGradient id="glassPanel" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#ffffff" stop-opacity=".78"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".48"/>
    <stop offset="1" stop-color="#e0f2fe" stop-opacity=".38"/>
  </linearGradient>
  <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#ffffff" stop-opacity=".95"/>
    <stop offset=".4" stop-color="#ffffff" stop-opacity=".25"/>
    <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orbA"><stop stop-color="#38bdf8" stop-opacity=".4"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbB"><stop stop-color="#67e8f9" stop-opacity=".32"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></radialGradient>
  <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity=".12"/></filter>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcff"/><stop offset=".55" stop-color="#eef8ff"/><stop offset="1" stop-color="#d4effe"/></linearGradient><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="2" y="2" width="756" height="316" rx="25" fill="url(#bg)"/>
<circle cx="120" cy="60" r="120" fill="url(#orbA)" opacity=".45"/>
<circle cx="650" cy="260" r="140" fill="url(#orbB)" opacity=".4"/>
<g filter="url(#glassShadow)">
  <rect x="10" y="10" width="740" height="300" rx="22" fill="url(#glassPanel)" stroke="#ffffff" stroke-opacity=".75"/>
  <rect x="11" y="11" width="738" height="48" rx="21" fill="url(#glassEdge)" opacity=".55"/>
</g>
<text x="28" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="900" letter-spacing="2" fill="#0c4a6e">PROFILE SNAPSHOT</text><text x="730" y="38" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" fill="#64748b">29 JUL 2026</text>
<g transform="translate(146 171)">
  <circle r="92" fill="#ffffff" stroke="#0284c7" stroke-width="14"/>
  <circle r="92" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="578" transform="rotate(-90)" filter="url(#g)"><animate attributeName="stroke-dashoffset" from="578" to="104" dur="1.3s" begin=".3s" fill="freeze"/></circle>
  <text y="10" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="950" fill="#0c4a6e" opacity="0">A<animate attributeName="opacity" from="0" to="1" dur=".5s" begin="1s" fill="freeze"/></text>
  <text y="39" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2" fill="#0284c7">BUILDER RANK</text>
</g>
<g opacity="0" transform="translate(24 0)">
  <animate attributeName="opacity" from="0" to="1" dur=".45s" begin="0.55s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur=".45s" begin="0.55s" fill="freeze"/>
  <text x="300" y="82" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#0369a1" letter-spacing="1">PUBLIC REPOSITORIES</text>
  <text x="690" y="82" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="900" fill="#38bdf8">26</text>
  <rect x="300" y="94" width="390" height="7" rx="3.5" fill="#dbeafe"/>
  <rect x="300" y="94" width="0" height="7" rx="3.5" fill="#38bdf8"><animate attributeName="width" from="0" to="292" dur=".75s" begin="0.71s" fill="freeze"/></rect>
</g><g opacity="0" transform="translate(24 0)">
  <animate attributeName="opacity" from="0" to="1" dur=".45s" begin="0.73s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur=".45s" begin="0.73s" fill="freeze"/>
  <text x="300" y="130" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#0369a1" letter-spacing="1">FOLLOWERS</text>
  <text x="690" y="130" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="900" fill="#38bdf8">3</text>
  <rect x="300" y="142" width="390" height="7" rx="3.5" fill="#dbeafe"/>
  <rect x="300" y="142" width="0" height="7" rx="3.5" fill="#38bdf8"><animate attributeName="width" from="0" to="203" dur=".75s" begin="0.89s" fill="freeze"/></rect>
</g><g opacity="0" transform="translate(24 0)">
  <animate attributeName="opacity" from="0" to="1" dur=".45s" begin="0.91s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur=".45s" begin="0.91s" fill="freeze"/>
  <text x="300" y="178" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#0369a1" letter-spacing="1">FOLLOWING</text>
  <text x="690" y="178" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="900" fill="#67e8f9">2</text>
  <rect x="300" y="190" width="390" height="7" rx="3.5" fill="#dbeafe"/>
  <rect x="300" y="190" width="0" height="7" rx="3.5" fill="#67e8f9"><animate attributeName="width" from="0" to="164" dur=".75s" begin="1.07s" fill="freeze"/></rect>
</g><g opacity="0" transform="translate(24 0)">
  <animate attributeName="opacity" from="0" to="1" dur=".45s" begin="1.09s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur=".45s" begin="1.09s" fill="freeze"/>
  <text x="300" y="226" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#0369a1" letter-spacing="1">GITHUB ACHIEVEMENTS</text>
  <text x="690" y="226" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" font-weight="900" fill="#7dd3fc">2</text>
  <rect x="300" y="238" width="390" height="7" rx="3.5" fill="#dbeafe"/>
  <rect x="300" y="238" width="0" height="7" rx="3.5" fill="#7dd3fc"><animate attributeName="width" from="0" to="226" dur=".75s" begin="1.25s" fill="freeze"/></rect>
</g>
<text x="28" y="294" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Static local card • public-profile values can change after this snapshot</text>
</svg>