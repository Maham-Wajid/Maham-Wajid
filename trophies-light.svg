<g clip-path="url(#clip)"><rect x="-180" y="0" width="140" height="300" fill="url(#shine)" transform="skewX(-18)" opacity=".26"><animate attributeName="x" from="-180" to="940" dur="4.2s" begin="1.3s" repeatCount="indefinite"/></rect></g>
