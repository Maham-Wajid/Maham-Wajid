<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="title desc">
<title id="title">Animated local achievement trophies</title><desc id="desc">Four local award cells for final-year project recognition, instruction, GitHub achievement, and HSK certification.</desc>
<defs>
  <linearGradient id="glassPanel" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#ffffff" stop-opacity=".78"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".48"/>
    <stop offset="1" stop-color="#e0f2fe" stop-opacity=".38"/>
  </linearGradient>
  <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#ffffff" stop-opacity=".95"/>
    <stop offset=".4" stop-color="#ffffff" stop-opacity=".25"/>
    <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orbA"><stop stop-color="#38bdf8" stop-opacity=".4"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbB"><stop stop-color="#67e8f9" stop-opacity=".32"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></radialGradient>
  <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity=".12"/></filter>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#dff2fe"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="clip"><rect x="2" y="2" width="776" height="296" rx="25"/></clipPath></defs>
<rect x="2" y="2" width="776" height="296" rx="25" fill="url(#bg)"/>
<circle cx="140" cy="70" r="120" fill="url(#orbA)" opacity=".4"/>
<circle cx="660" cy="230" r="140" fill="url(#orbB)" opacity=".35"/>
<g filter="url(#glassShadow)">
  <rect x="10" y="10" width="760" height="280" rx="22" fill="url(#glassPanel)" stroke="#ffffff" stroke-opacity=".75"/>
  <rect x="11" y="11" width="758" height="46" rx="21" fill="url(#glassEdge)" opacity=".55"/>
</g>
<text x="28" y="39" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="900" letter-spacing="2" fill="#0c4a6e">MILESTONES &amp; TROPHIES</text>
