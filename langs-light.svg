<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
<title id="title">Animated working language bars</title><desc id="desc">Language and technology emphasis derived from Maham Wajid's CV, expressed as qualitative bars rather than fabricated percentages.</desc>
<defs>
  <linearGradient id="glassPanel" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#ffffff" stop-opacity=".78"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".48"/>
    <stop offset="1" stop-color="#e0f2fe" stop-opacity=".38"/>
  </linearGradient>
  <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#ffffff" stop-opacity=".95"/>
    <stop offset=".4" stop-color="#ffffff" stop-opacity=".25"/>
    <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="orbA"><stop stop-color="#38bdf8" stop-opacity=".4"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbB"><stop stop-color="#67e8f9" stop-opacity=".32"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></radialGradient>
  <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity=".12"/></filter>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#dff2fe"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="card"><rect x="2" y="2" width="756" height="316" rx="25"/></clipPath></defs>
<rect x="2" y="2" width="756" height="316" rx="25" fill="url(#bg)"/>
<circle cx="100" cy="80" r="110" fill="url(#orbA)" opacity=".4"/>
<circle cx="680" cy="240" r="130" fill="url(#orbB)" opacity=".35"/>
<g filter="url(#glassShadow)">
  <rect x="10" y="10" width="740" height="300" rx="22" fill="url(#glassPanel)" stroke="#ffffff" stroke-opacity=".75"/>
  <rect x="11" y="11" width="738" height="48" rx="21" fill="url(#glassEdge)" opacity=".55"/>
</g>
<text x="28" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="900" letter-spacing="2" fill="#0c4a6e">WORKING LANGUAGE EMPHASIS</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="0.35s" fill="freeze"/>
<text x="30" y="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#0c4a6e">PYTHON</text>
<text x="730" y="78" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Expert • backend &amp; AI</text>
<rect x="30" y="89" width="700" height="9" rx="4.5" fill="#dbeafe"/><rect x="30" y="89" width="0" height="9" rx="4.5" fill="#38bdf8"><animate attributeName="width" from="0" to="520" dur=".9s" begin="0.45s" fill="freeze"/></rect></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="0.53s" fill="freeze"/>
<text x="30" y="123" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#0c4a6e">JAVASCRIPT / TYPESCRIPT</text>
<text x="730" y="123" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Full-stack web</text>
<rect x="30" y="134" width="700" height="9" rx="4.5" fill="#dbeafe"/><rect x="30" y="134" width="0" height="9" rx="4.5" fill="#38bdf8"><animate attributeName="width" from="0" to="445" dur=".9s" begin="0.63s" fill="freeze"/></rect></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="0.71s" fill="freeze"/>
<text x="30" y="168" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#0c4a6e">VUE / REACT</text>
<text x="730" y="168" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Product UI workflows</text>
<rect x="30" y="179" width="700" height="9" rx="4.5" fill="#dbeafe"/><rect x="30" y="179" width="0" height="9" rx="4.5" fill="#42b883"><animate attributeName="width" from="0" to="400" dur=".9s" begin="0.81s" fill="freeze"/></rect></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="0.89s" fill="freeze"/>
<text x="30" y="213" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#0c4a6e">SQL</text>
<text x="730" y="213" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Production data work</text>
<rect x="30" y="224" width="700" height="9" rx="4.5" fill="#dbeafe"/><rect x="30" y="224" width="0" height="9" rx="4.5" fill="#67e8f9"><animate attributeName="width" from="0" to="385" dur=".9s" begin="0.99s" fill="freeze"/></rect></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="1.07s" fill="freeze"/>
<text x="30" y="258" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#0c4a6e">PROMPT / AI EVAL</text>
<text x="730" y="258" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Coding-agent evaluation</text>
<rect x="30" y="269" width="700" height="9" rx="4.5" fill="#dbeafe"/><rect x="30" y="269" width="0" height="9" rx="4.5" fill="#7dd3fc"><animate attributeName="width" from="0" to="360" dur=".9s" begin="1.17s" fill="freeze"/></rect></g>
<g clip-path="url(#card)"><rect x="-160" y="0" width="120" height="320" fill="url(#shine)" transform="skewX(-18)" opacity=".3"><animate attributeName="x" from="-160" to="880" dur="4.6s" begin="1.6s" repeatCount="indefinite"/></rect></g>
</svg>