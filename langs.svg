<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
<title id="title">Animated working language bars</title><desc id="desc">Language and technology emphasis derived from Maham Wajid's CV, expressed as qualitative bars rather than fabricated percentages.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c0714"/><stop offset="1" stop-color="#26103a"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="card"><rect x="2" y="2" width="756" height="316" rx="25"/></clipPath></defs>
<rect x="2" y="2" width="756" height="316" rx="25" fill="url(#bg)" stroke="#d946ef" stroke-opacity=".55" stroke-width="2"/>
<text x="28" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="900" letter-spacing="2" fill="#f5d0fe">WORKING LANGUAGE EMPHASIS</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="0.35s" fill="freeze"/>
<text x="30" y="78" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#f4e9fb">PYTHON</text>
<text x="730" y="78" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#b9a1c8">Expert • backend &amp; AI</text>
<rect x="30" y="89" width="700" height="9" rx="4.5" fill="#291638"/><rect x="30" y="89" width="0" height="9" rx="4.5" fill="#ff72c8"><animate attributeName="width" from="0" to="520" dur=".9s" begin="0.45s" fill="freeze"/></rect></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="0.53s" fill="freeze"/>
<text x="30" y="123" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#f4e9fb">JAVASCRIPT / TYPESCRIPT</text>
<text x="730" y="123" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#b9a1c8">Full-stack web</text>
<rect x="30" y="134" width="700" height="9" rx="4.5" fill="#291638"/><rect x="30" y="134" width="0" height="9" rx="4.5" fill="#c06cff"><animate attributeName="width" from="0" to="445" dur=".9s" begin="0.63s" fill="freeze"/></rect></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="0.71s" fill="freeze"/>
<text x="30" y="168" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#f4e9fb">SQL</text>
<text x="730" y="168" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#b9a1c8">Production data work</text>
<rect x="30" y="179" width="700" height="9" rx="4.5" fill="#291638"/><rect x="30" y="179" width="0" height="9" rx="4.5" fill="#a78bfa"><animate attributeName="width" from="0" to="420" dur=".9s" begin="0.81s" fill="freeze"/></rect></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="0.89s" fill="freeze"/>
<text x="30" y="213" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#f4e9fb">DART</text>
<text x="730" y="213" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#b9a1c8">Flutter mobile</text>
<rect x="30" y="224" width="700" height="9" rx="4.5" fill="#291638"/><rect x="30" y="224" width="0" height="9" rx="4.5" fill="#ff9dcf"><animate attributeName="width" from="0" to="310" dur=".9s" begin="0.99s" fill="freeze"/></rect></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".45s" begin="1.07s" fill="freeze"/>
<text x="30" y="258" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="900" fill="#f4e9fb">C# / C++</text>
<text x="730" y="258" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#b9a1c8">Academic foundations</text>
<rect x="30" y="269" width="700" height="9" rx="4.5" fill="#291638"/><rect x="30" y="269" width="0" height="9" rx="4.5" fill="#8be9fd"><animate attributeName="width" from="0" to="245" dur=".9s" begin="1.17s" fill="freeze"/></rect></g>
<g clip-path="url(#card)"><rect x="-160" y="0" width="120" height="320" fill="url(#shine)" transform="skewX(-18)" opacity=".3"><animate attributeName="x" from="-160" to="880" dur="4.6s" begin="1.6s" repeatCount="indefinite"/></rect></g>
</svg>